services:
  decision:
    build: .
    container_name: decision-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/decision.db
      - DEBUG=false
    volumes:
      - decision_data:/app/data
    networks:
      - nwdaf-network

volumes:
  decision_data:

networks:
  nwdaf-network:
    external: true
