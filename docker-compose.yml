services:
  decision:
    build: .
    container_name: decision-service
    restart: unless-stopped
    ports:
      - "${DECISION_PORT:-8000}:${DECISION_PORT:-8000}"
    environment:
      - KAFKA_HOST=${KAFKA_HOST:-kafka}
      - KAFKA_PORT=${KAFKA_PORT:-9092}
      - KAFKA_INPUT_TOPIC=${KAFKA_INPUT_TOPIC:-network.ml.results}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_DEBOUNCE_SECONDS=${KAFKA_DEBOUNCE_SECONDS:-60}
      - LLM_URL=${LLM_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      - LLM_TOP_K=${LLM_TOP_K:-10}
      - LLM_TOP_P=${LLM_TOP_P:-0.9}
      - LLM_NUM_PREDICT=${LLM_NUM_PREDICT:-1024}
      - LLM_REPEAT_PENALTY=${LLM_REPEAT_PENALTY:-1.3}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_PROMPT_PATH=${LLM_PROMPT_PATH:-llm/prompt.txt}
      - LLM_SYSTEM_PATH=${LLM_SYSTEM_PATH:-llm/system.txt}
      - BLACKLIST_ENABLED=${BLACKLIST_ENABLED:-true}
      - DECISION_HISTORY_SIZE=${DECISION_HISTORY_SIZE:-20}
      - DB_PATH=/app/data/decision.db
      - DEBUG=false
      - DPORT=${DECISION_PORT:-8000}
      - DEV_MODE=${DEV_MODE:-false}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/auth}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-aion}
    volumes:
      - decision_data:/app/data
    networks:
      - nwdaf-network

volumes:
  decision_data:

networks:
  nwdaf-network:
    name: nwdaf-network
