[project]
name = "decision-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.128.6",
    "pydantic==2.12.5",
    "uvicorn==0.34.0",
    "sqlmodel==0.0.32",
    "pydantic-settings==2.7.1",
    "confluent-kafka==2.13.0",
    "pygments>=2.20.0",
